name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Keep the release binary's glibc baseline lower than the newest runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${package_version}." >&2
            echo "Bump package.json and commit it before creating the release tag." >&2
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build single-file binary
        run: bun run build:binary

      - name: Package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          artifact="dudu-${version}-linux-x64"
          mkdir -p release/package
          cp release/dudu release/package/dudu
          tar -C release/package -czf "release/${artifact}.tar.gz" dudu
          (cd release && sha256sum "${artifact}.tar.gz" > "${artifact}.tar.gz.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          artifact="release/dudu-${version}-linux-x64.tar.gz"
          checksum="${artifact}.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$artifact" "$checksum" --clobber
          else
            gh release create "$RELEASE_TAG" "$artifact" "$checksum" \
              --title "dudu ${version}" \
              --generate-notes
          fi
